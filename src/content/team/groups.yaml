# Sub-sections of the homepage Team section, shown in `order`. Each member in
# members.yaml names one of these ids in its `group` field. To add a committee,
# add an entry here and point its members at it.
- id: exec
  title: Club Execs
  order: 1
  description: >-
    The Club Execs for the 2024 – 2025 school year. Each of them manages a
    separate area of the club, and together they keep the team operational.

- id: trs
  title: TAMS Repair Society
  order: 2
  description: >-
    The committee that repairs devices, vehicles, and instruments for other
    TAMS students and runs workshops on how technology works.
